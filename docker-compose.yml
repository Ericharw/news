services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-nextjs
    restart: unless-stopped
    env_file:
      - .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:3000"
    networks:
      - news_network

# volumes:
#   postgres_data:

networks:
  news_network:
    driver: bridge
